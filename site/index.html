<!DOCTYPE html>
<!-- gorgegauge -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GorgeGauge — Husum Falls Live Conditions</title>
  <meta name="description" content="Live trail cam gauge reading for Husum Falls on the White Salmon River, WA. AI-estimated water level updated daily." />
  <meta property="og:title" content="GorgeGauge — Husum Falls Live Conditions" />
  <meta property="og:description" content="Live trail cam gauge reading for Husum Falls on the White Salmon River, WA. AI-estimated water level updated daily." />
  <meta property="og:url" content="https://gorgegauge.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GorgeGauge" />
  <meta property="og:image" content="https://gorgegauge.com/husum-preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GorgeGauge — Husum Falls Live Conditions" />
  <meta name="twitter:description" content="Live trail cam gauge reading for Husum Falls on the White Salmon River, WA. AI-estimated water level updated daily." />
  <meta name="twitter:image" content="https://gorgegauge.com/husum-preview.jpg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="stylesV2.css" />
</head>

<body data-location="Trout Creek">
  <header class="site-header">
    <div class="logo">GorgeGauge</div>

    <div class="subtitle">
      <span class="location-picker">
        <select id="locationSelect" class="location-select" aria-label="Location">
          <option value="/index.html" data-location="Husum">Husum</option>
          <option value="/troutcreek.html" data-location="Trout Creek">Trout Creek</option>
        </select>
      </span>
      | Live Conditions
      <span class="subtitle-sep">·</span>
      <a href="/gauges.html" class="disclaimer-link">Gorge Gauges</a>
      <span class="subtitle-sep">·</span>
      <a href="/disclaimer.html" class="disclaimer-link">Disclaimer</a>
    </div>
  </header>

  <main>
    <!-- Gauge strip — hidden until JS loads gauge data -->
    <section class="gauge-strip" id="gaugeStrip">
      <div class="gauge-head">
        <div class="gauge-reading">
          <span class="gauge-num" id="gaugeNumber">—</span><span class="gauge-unit"> ft</span>
        </div>
        <span class="gauge-badge" id="gaugeBadge"></span>
        <span class="gauge-trend" id="gaugeTrend"></span>
      </div>
      <div class="gauge-bar-track">
        <div class="gauge-bar-fill" id="gaugeBarFill"></div>
      </div>
      <div class="gauge-ticks">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6 ft</span>
      </div>
      <div class="gauge-footer">
        <span class="gauge-read-at" id="gaugeReadAt"></span>
        <span class="gauge-notes" id="gaugeNotes"></span>
      </div>
    </section>

    <section class="gallery-section">
      <div class="gallery-controls">
        <div id="status" class="status">Loading…</div>
        <div class="archive-wrap">
          <button type="button" class="archive-btn" id="archiveBtn">
            📅 <span class="archive-btn-text">Browse dates</span>
          </button>
          <input type="date" id="datePicker" class="date-picker-sr" aria-label="Browse past dates" />
          <button id="datePickerClear" class="date-picker-clear hidden" title="Back to latest">✕ Today</button>
        </div>
      </div>
      <div id="gallery" class="gallery-grid"></div>
    </section>

    <!-- Paddler Reports -->
    <section class="reports-section">
      <div class="reports-label">Paddler Reports</div>

      <form class="report-form" id="reportForm" novalidate>
        <!-- honeypot — bots fill this, humans don't see it -->
        <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off" />
        <input type="text" name="name" placeholder="Your name (optional)" maxlength="50" />
        <div class="report-form-row">
          <textarea name="text" placeholder="Share conditions — e.g. &quot;Ran Husum today at 2.3 ft, everything going&quot;" maxlength="280" rows="2" required></textarea>
          <button type="submit" class="report-submit">Share Beta</button>
        </div>
        <span class="report-msg" id="reportMsg" style="display:none"></span>
      </form>

      <div id="reportList"></div>
    </section>
  </main>

  <!-- LIGHTBOX OVERLAY (must be EXACTLY like this) -->
  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" aria-label="Close image">&times;</button>
      <img id="lightbox-image" src="" alt="Expanded view" />
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <footer class="site-footer">
    <span>© <span id="year"></span> GorgeGauge &nbsp;·&nbsp; <a href="/disclaimer.html" style="color:inherit;text-decoration:none;opacity:0.7;">Disclaimer</a></span>
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="gorgegauge" data-color="#5F7FFF" data-emoji="🚣‍♀️"  data-font="Poppins" data-text="Support Gorge Gauge" data-outline-color="#000000" data-font-color="#ffffff" data-coffee-color="#FFDD00" ></script>
  </footer>

 <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    (function syncDropdownToPage() {
      const select = document.getElementById("locationSelect");
      if (!select) return;

      const path = (window.location.pathname || "/").toLowerCase();
      for (const opt of select.options) {
        const optPath = (opt.value || "").toLowerCase();
        if (optPath === path) {
          select.value = opt.value;
          return;
        }
      }

      if (path === "/" || path.endsWith("/index.html")) {
        select.value = "/index.html";
      }
    })();

    document.getElementById("locationSelect").addEventListener("change", function () {
      window.location.href = this.value;
    });
  </script>
<script>
  window.GORGEGAUGE_LATEST_JSON = "/latestHusum.json";
  window.GORGEGAUGE_GAUGE_JSON  = "/husumGauge.json";
  window.GORGEGAUGE_LOCATION_LABEL = "Husum";
  window.GORGEGAUGE_REPORTS_JSON = "/husumReports.json";
  window.GORGEGAUGE_INDEX_JSON   = "/husumIndex.json";
  window.REPORTS_API = "https://6k000v78qa.execute-api.us-east-2.amazonaws.com/prod/report";
</script>
  <script src="appv6.js"></script>
</body>
</html>
